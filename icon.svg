<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shuryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer circle shadow & border -->
  <circle cx="256" cy="256" r="240" fill="url(#shuryGrad)" filter="url(#shadow)" stroke="#4c1d95" stroke-width="6" />
  
  <!-- Outer decorative white ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#ffffff" stroke-width="7" stroke-dasharray="16 8" opacity="0.9" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75" />
  
  <!-- Inner sublimation workshop symbol (T-shirt + Mug + Spark) -->
  <g transform="translate(256, 256) scale(1.15) translate(-256, -256)">
    <!-- Sublimation press / diamond spark -->
    <path d="M256,120 L285,215 L380,244 L285,273 L256,368 L227,273 L132,244 L227,215 Z" fill="#ffffff" />
    <path d="M256,155 L275,225 L345,244 L275,263 L256,333 L237,263 L167,244 L237,225 Z" fill="#a78bfa" opacity="0.35" />
    <!-- Center core jewel -->
    <circle cx="256" cy="244" r="18" fill="#ffffff" stroke="#7c3aed" stroke-width="4" />
  </g>
</svg>
